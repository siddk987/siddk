<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F1E8"/>
      <stop offset="50%" stop-color="#EAE3D6"/>
      <stop offset="100%" stop-color="#E7EDF5"/>
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D98A55"/>
      <stop offset="100%" stop-color="#C47745"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(23, 43, 77, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Frame Background with subtle pattern -->
  <rect width="480" height="580" rx="16" fill="url(#bgGrad)"/>
  <rect width="480" height="580" rx="16" fill="url(#grid)"/>

  <!-- Subtle Architectural & Geometric Accent Rings -->
  <circle cx="240" cy="240" r="170" fill="none" stroke="rgba(196, 119, 69, 0.15)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="240" cy="240" r="140" fill="none" stroke="rgba(23, 43, 77, 0.12)" stroke-width="1"/>
  <circle cx="240" cy="240" r="105" fill="#FFFFFF" fill-opacity="0.4"/>

  <!-- Abstract Finance / Trend Lines -->
  <path d="M 90 380 Q 180 320 240 340 T 390 280" fill="none" stroke="rgba(120, 145, 138, 0.35)" stroke-width="2"/>
  <path d="M 90 410 Q 160 360 270 380 T 390 320" fill="none" stroke="rgba(196, 119, 69, 0.25)" stroke-width="1.5"/>

  <!-- Minimalist Portrait Silhouette -->
  <g transform="translate(0, -10)">
    <!-- Head & Hair Silhouette -->
    <circle cx="240" cy="195" r="54" fill="#172B4D"/>
    <!-- Suit / Shoulders -->
    <path d="M 140 370 C 140 300, 180 270, 240 270 C 300 270, 340 300, 340 370 Z" fill="#172B4D"/>
    <!-- Collar & Tie Accent -->
    <polygon points="240,270 220,310 240,325 260,310" fill="#FFFFFF"/>
    <polygon points="234,310 246,310 243,365 237,365" fill="#C47745"/>
  </g>

  <!-- SK Monogram Seal -->
  <g transform="translate(375, 45)">
    <circle cx="0" cy="0" r="26" fill="url(#terracottaGrad)"/>
    <text x="0" y="7" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SK.</text>
  </g>

  <!-- Bottom Floating Badge / Label -->
  <g transform="translate(40, 480)">
    <!-- Badge Background -->
    <rect width="400" height="64" rx="10" fill="#FFFFFF" stroke="rgba(23, 43, 77, 0.12)" stroke-width="1" filter="drop-shadow(0 4px 12px rgba(23, 43, 77, 0.06))"/>
    
    <!-- Label Text -->
    <text x="200" y="27" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#C47745" text-anchor="middle" letter-spacing="2">FINANCE • ECONOMICS • BUSINESS</text>
    <text x="200" y="47" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#292D32" text-anchor="middle">Siddharth Kumar — Portfolio Portrait</text>
  </g>
</svg>